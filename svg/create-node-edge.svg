  <circle cx="35" cy="25" r="0" fill="#34a853">
    <animate attributeName="r" values="0;0;8;8;8;0;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <line x1="23" y1="25" x2="35" y2="25" stroke="#ea4335" stroke-width="2" opacity="0">
